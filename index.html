    <div class="welcome"></div>
    <script>
        ;(function () {
            var welcome = document.querySelector('.welcome')
            var backgrounds = [
                'img/welcome/welcome-1.jpg',
                'img/welcome/welcome-2.jpg',
                'img/welcome/welcome-3.jpg',
                'img/welcome/welcome-4.jpg',
                'img/welcome/welcome-5.jpg',
                'img/welcome/welcome-6-ukraine.jpg',
                'img/welcome/welcome-7.png',
                'img/welcome/welcome-8.png',
                'img/welcome/welcome-9.png',
                'img/welcome/welcome-10.png',
                'img/welcome/welcome-11.png'
            ]

            if (!welcome || !backgrounds.length) return

            var oldLogo = welcome.querySelector('.welcome__logo')
            if (oldLogo) oldLogo.remove()

            var style = document.getElementById('lampaua-welcome-style')
            if (!style) {
                style = document.createElement('style')
                style.id = 'lampaua-welcome-style'
                style.textContent =
                    '.welcome{background-color:#03050a!important;background-size:cover!important;background-position:center!important;overflow:hidden;}' +
                    '.welcome:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(31,118,204,.22),transparent 26%),linear-gradient(90deg,rgba(0,0,0,.9),rgba(3,5,10,.5) 35%,rgba(3,5,10,.56) 65%,rgba(0,0,0,.92)),linear-gradient(180deg,rgba(0,0,0,.82),rgba(0,0,0,.3) 42%,rgba(0,0,0,.88));}' +
                    '.welcome:after{content:"";position:absolute;inset:-20%;z-index:1;pointer-events:none;background:linear-gradient(108deg,transparent 0 47%,rgba(255,216,0,.5) 49%,rgba(38,139,255,.52) 50%,transparent 53%),linear-gradient(90deg,transparent 0 30%,rgba(38,139,255,.24) 30.2%,transparent 30.55%,transparent 68%,rgba(255,216,0,.2) 68.2%,transparent 68.55%);opacity:.7;animation:lampauaLines 5.5s ease-in-out infinite alternate;}' +
                    '.welcome__lampaua-intro{position:absolute;left:50%;top:43%;z-index:2;transform:translate(-50%,-50%);font-family:Arial Black,Segoe UI,sans-serif;font-size:min(11vw,7.8em);font-weight:900;letter-spacing:.08em;text-transform:uppercase;line-height:1;color:#ffd800;text-shadow:-.045em 0 0 rgba(38,139,255,.9),0 0 .45em rgba(0,0,0,.85);pointer-events:none;user-select:none;opacity:.92;animation:lampauaTitle 3.8s ease-in-out infinite;text-align:center;}' +
                    '.welcome__lampaua-intro span{color:#268bff;text-shadow:.045em 0 0 rgba(255,216,0,.88),0 0 .45em rgba(0,0,0,.85);}' +
                    '.welcome__lampaua-badge{font-size:0.25em;letter-spacing:0.2em;color:#4ade80;display:block;margin-top:0.4em;text-shadow:0 0 10px rgba(74,222,128,0.5);}' +
                    '@keyframes lampauaTitle{0%{opacity:.75;transform:translate(-50%,-50%) scale(.985)}45%{opacity:.98;transform:translate(-50%,-50%) scale(1.015)}100%{opacity:.82;transform:translate(-50%,-50%) scale(1)}}' +
                    '@keyframes lampauaLines{0%{transform:translate3d(-1.5%,0,0)}100%{transform:translate3d(1.5%,0,0)}}'
                document.head.appendChild(style)
            }

            var brand = welcome.querySelector('.welcome__lampaua-intro')
            if (!brand) {
                brand = document.createElement('div')
                brand.className = 'welcome__lampaua-intro'
                brand.innerHTML = 'Lampa<span>Online</span><span class="welcome__lampaua-badge">100% DIRECT STREAMING</span>'
                welcome.appendChild(brand)
            }

            var selected = backgrounds[Math.floor(Math.random() * backgrounds.length)]
            var image = new Image()

            image.onload = function () {
                welcome.style.backgroundImage = 'url("' + selected + '")'
            }

            image.src = selected
        })()
    </script>

    <script>
        var lampa_url     = '';
        var cache_version = Math.floor((new Date()).getTime() / 9e5);
            
        function urlJoin(base, add) {
            if (base.charAt(base.length - 1) !== '/') {
                base += '/'
            }
            return base + add
        }

        function putScript(scripts, onload, onerror){
            var add = function(src){
                console.log('Loader', 'try-load-script', src)
                var trys = 0

                var sreateScript = function(){
                    var script = document.createElement('script')
                    script.type = 'text/javascript'

                    script.onload = script.onreadystatechange = function(e) {
                        console.log('Loader', 'Script loaded', e)
                        if (!!onload) onload()
                    };

                    script.onerror = function(){
                        trys++
                        console.log('Loader', 'error-load-script', src)

                        if(trys < 3){
                            sreateScript()
                        } else if (!!onerror) {
                            onerror()
                        } else{
                            $('.no-network').removeClass('hide')
                            $('.no-network__file').text(window.location.href + '/' + src)
                        }
                    }

                    script.src = src
                    document.getElementsByTagName('body')[0].appendChild(script)
                }

                sreateScript()
            }

            add(scripts)
        }

        function loadCurrentLampa() {
            putScript('app.min.js?v=' + cache_version, function () {})
        }

        function loadLocalLampa(){
            if(lampa_url !== '') window.local_lampa = true
            loadCurrentLampa()
        }

        if (typeof AndroidJS !== "undefined"
            && !!AndroidJS.getLampaURL
            && /^https?:\/\//i.test(AndroidJS.getLampaURL())
            && !/^https?:\/\//i.test(location.href)
        ) {
            lampa_url = urlJoin(AndroidJS.getLampaURL(),'')
        }

        if (lampa_url !== '') {
            putScript(
                urlJoin(lampa_url, 'app.min.js?v=' + cache_version),
                function () {
                    var css = urlJoin(lampa_url, 'css/app.css?v=' + cache_version)
                    $('head').append('<link rel="stylesheet" href="' + css + '">')
                },
                loadLocalLampa
            )
        }
        else {
            loadCurrentLampa()
        }
    </script>
